name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 python3
      - name: Generate payloads + run tests
        run: make test
      - name: Build x64 exe
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: GenPE
          path: build/GenPE.exe

  # rolling release: every push to main refreshes the "latest" release
  release-latest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GenPE
          path: artifact
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          make_latest: false
          files: artifact/GenPE.exe
          body: |
            Rolling build of `main` — built from ${{ github.sha }}.
            Signed payloads embedded; Windows/WinPE tool for UEFI CA 2023
            Secure Boot update.

  # versioned releases on v* tags
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GenPE
          path: artifact
      - uses: softprops/action-gh-release@v2
        with:
          files: artifact/GenPE.exe
          generate_release_notes: true
