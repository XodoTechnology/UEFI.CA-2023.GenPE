name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 python3
      - name: Generate payloads + run tests
        run: make test
      - name: Build x64 exe
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: GenPE-x64
          path: build/GenPE.exe

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 xz-utils
      - name: Install llvm-mingw (aarch64 windows target)
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar xf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build ARM64 exe
        run: make arm64
      - uses: actions/upload-artifact@v4
        with:
          name: GenPE-arm64
          path: build/GenPE-arm64.exe

  # rolling release: every push to main refreshes the "latest" release
  release-latest:
    needs: [build, build-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GenPE-x64
          path: artifact-x64
      - uses: actions/download-artifact@v4
        with:
          name: GenPE-arm64
          path: artifact-arm64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          make_latest: false
          files: |
            artifact-x64/GenPE.exe
            artifact-arm64/GenPE-arm64.exe
          body: |
            Rolling build of `main` — built from ${{ github.sha }}.
            Signed payloads embedded; Windows/WinPE tool for UEFI CA 2023
            Secure Boot update. x64 + ARM64.

  # versioned releases on v* tags
  release:
    needs: [build, build-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GenPE-x64
          path: artifact-x64
      - uses: actions/download-artifact@v4
        with:
          name: GenPE-arm64
          path: artifact-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact-x64/GenPE.exe
            artifact-arm64/GenPE-arm64.exe
          generate_release_notes: true
